name: ibs-care-ai-demo
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ibscare
      MYSQL_USER: ibscare
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [private]

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ibscare?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USER: ibscare
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    networks: [private]

  ai:
    build: ./ai-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [private]

  frontend:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [private, public]

volumes:
  mysql_data:
networks:
  private:
    internal: true
  public:
