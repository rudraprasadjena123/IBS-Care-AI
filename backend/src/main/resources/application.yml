spring:
  application:
    name: ibs-care-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ibscare?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:ibscare}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 16KB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
